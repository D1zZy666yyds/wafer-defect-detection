# 半导体晶圆缺陷检测配置文件
# 缺陷类别：scratch(划痕), particle(颗粒), notch(缺口)

path: e:/python的文件/MyWaferDemo/data
train: images/train
val: images/val

names:
  0: scratch
  1: particle
  2: notch

# 超分辨率配置
super_resolution:
  enabled: true
  scale_factor: 2
  model: esrgan

# 推理配置
inference:
  conf_threshold: 0.35
  iou_threshold: 0.45
  input_size: 640
  use_sr: false  # 默认不开启超分，可通过API控制

# 良率分析配置
yield_analysis:
  critical_defects: ['notch', 'scratch']
  major_defects: ['particle']
